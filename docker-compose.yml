services:
  frontend:
    build: ./frontend-file #file name
    volumes: 
        - /app/node_modules # this mention ignore this folder no need to modify
        - ./frontend-file:/app # this is the file name should update when i do the development same time in container first is the folder name and second is the file name in docker container 
    ports:
      - '3000:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true #this is used beacuse sometime systemm not reflect the react code properly in container while developement
  api:
    build: ./api
    volumes:         
        - ./api:/app # this is the file name should update when i do the development same time in container 
    ports:
      - '5050:5050'
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongodb_data:/data/db  # data/db is the defualt path of database in mongo db this vloume is using to store the mono data in this vloulme otherwise when i restart the containter the db refresh
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
    depends_on:
      - mongo
volumes:
  mongodb_data:
